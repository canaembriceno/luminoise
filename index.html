<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0000f2">
<meta name="color-scheme" content="dark">
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
>
<title>SISIFO — Luminoise Mobile</title>
<link rel="stylesheet" href="styles/sisifo/tokens.css">
<link rel="stylesheet" href="styles/sisifo/fonts.css">
<link rel="stylesheet" href="styles/sisifo/base.css">
<link rel="stylesheet" href="styles/sisifo/components.css">
<link rel="stylesheet" href="styles/sisifo/utilities.css">
<link rel="stylesheet" href="styles/mobile.css">
</head>
<body>
  <header>
    <div class="sisifo-logo" aria-hidden="true">
      <span class="sisifo-logo-icon"></span>
    </div>
    <h1>Luminoise</h1>
    <span class="meta" aria-hidden="true">fuente → haces → propagación</span>
    <span class="spacer"></span>
    <span id="stats" aria-live="polite">—</span>
  </header>

  <main>
    <div class="stage" id="stage">
      <canvas id="view" class="sisifo-frame-inner" width="720" height="960" aria-label="Resultado Luminoise"></canvas>
      <p class="empty" id="empty">Sube una imagen para comenzar</p>
    </div>

    <nav class="toolbar" aria-label="Controles de Luminoise">
      <label class="btn" for="file" title="Subir imagen">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>
        </svg>
        <span>Subir</span>
        <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
      </label>

      <button class="btn btn-play" id="btnPlay" type="button" aria-pressed="false" title="Reproducir / Pausar">
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M9 5v14"/><path d="M15 5v14"/>
        </svg>
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
          <path d="M7 4.5v15l13-7.5z"/>
        </svg>
        <span id="playLabel">Play</span>
      </button>

      <button class="btn" id="btnEngine" type="button" title="Cambiar forma de audio">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M3 12h2l2-6 3 12 3-9 2 4h6"/>
        </svg>
        <span id="engineLabel">Arcade</span>
      </button>

      <button class="btn" id="btnSeq" type="button" title="Cambiar secuencia">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="m4 4 5 5"/>
        </svg>
        <span id="seqLabel">Secuencia</span>
      </button>

      <button class="btn" id="btnPng" type="button" title="Guardar PNG">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4v12"/><path d="m7 11 5 5 5-5"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/>
        </svg>
        <span>PNG</span>
      </button>
    </nav>
  </main>

  <script type="module" src="src/app-mobile.js"></script>
</body>
</html>
